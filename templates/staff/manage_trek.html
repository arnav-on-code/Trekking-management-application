{% extends "staff/base.html" %}

{% block title %}
Manage Trek
{% endblock %}

{% block staff_content %}

<h2 class="mb-4">
    Manage Trek
</h2>

<div class="card shadow">

    <div class="card-header bg-primary text-white">

        <h4>{{ trek.name }}</h4>

    </div>

    <div class="card-body">

        <p>
            <strong>Location:</strong>
            {{ trek.location }}
        </p>

        <p>
            <strong>Difficulty:</strong>
            {{ trek.difficulty }}
        </p>

        <p>
            <strong>Total Slots:</strong>
            {{ trek.total_slots }}
        </p>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Available Slots
                </label>

                <input
                    type="number"
                    name="available_slots"
                    class="form-control"
                    min="0"
                    max="{{ trek.total_slots }}"
                    value="{{ trek.available_slots }}"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Trek Status
                </label>

                <select
                    name="status"
                    class="form-select"
                    required>

                    <option value="Open"
                        {% if trek.status == "Open" %}selected{% endif %}>
                        Open
                    </option>

                    <option value="Closed"
                        {% if trek.status == "Closed" %}selected{% endif %}>
                        Closed
                    </option>

                    <option value="Completed"
                        {% if trek.status == "Completed" %}selected{% endif %}>
                        Completed
                    </option>

                </select>

            </div>

            <button
                type="submit"
                class="btn btn-success">

                Update Trek

            </button>

            <a href="{{ url_for('staff.participants', trek_id=trek.id) }}"
               class="btn btn-primary">

                View Participants

            </a>

            <a href="{{ url_for('staff.assigned_treks') }}"
               class="btn btn-secondary">

                Back

            </a>

        </form>

    </div>

</div>

{% endblock %}
