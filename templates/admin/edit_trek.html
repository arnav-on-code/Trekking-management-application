{% extends "admin/base.html" %}
{% block title %}
Edit Trek
{% endblock %}

{% block admin_content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">
            <h3>Edit Trek</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Trek Name</label>
                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ trek.name }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input
                        type="text"
                        name="location"
                        class="form-control"
                        value="{{ trek.location }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Difficulty</label>

                    <select name="difficulty" class="form-select" required>

                        <option value="Easy"
                            {% if trek.difficulty == "Easy" %}selected{% endif %}>
                            Easy
                        </option>

                        <option value="Moderate"
                            {% if trek.difficulty == "Moderate" %}selected{% endif %}>
                            Moderate
                        </option>

                        <option value="Hard"
                            {% if trek.difficulty == "Hard" %}selected{% endif %}>
                            Hard
                        </option>

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Duration (Days)</label>
                    <input
                        type="number"
                        name="duration"
                        class="form-control"
                        min="1"
                        value="{{ trek.duration }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Total Slots</label>
                    <input
                        type="number"
                        name="total_slots"
                        class="form-control"
                        min="1"
                        value="{{ trek.total_slots }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>

                    <textarea
                        name="description"
                        rows="4"
                        class="form-control">{{ trek.description }}</textarea>

                </div>

                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label">Start Date</label>

                        <input
                            type="date"
                            name="start_date"
                            class="form-control"
                            value="{{ trek.start_date.strftime('%Y-%m-%d') }}"
                            required>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">End Date</label>

                        <input
                            type="date"
                            name="end_date"
                            class="form-control"
                            value="{{ trek.end_date.strftime('%Y-%m-%d') }}"
                            required>

                    </div>

                </div>

                <br>

                <div class="mb-3">

                    <label class="form-label">Status</label>

                    <select
                        name="status"
                        class="form-select">

                        <option value="Pending"
                            {% if trek.status == "Pending" %}selected{% endif %}>
                            Pending
                        </option>

                        <option value="Approved"
                            {% if trek.status == "Approved" %}selected{% endif %}>
                            Approved
                        </option>

                        <option value="Open"
                            {% if trek.status == "Open" %}selected{% endif %}>
                            Open
                        </option>

                        <option value="Closed"
                            {% if trek.status == "Closed" %}selected{% endif %}>
                            Closed
                        </option>

                        <option value="Completed"
                            {% if trek.status == "Completed" %}selected{% endif %}>
                            Completed
                        </option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-warning">

                    Update Trek

                </button>

                <a
                    href="{{ url_for('admin.treks') }}"
                    class="btn btn-secondary">

                    Cancel

                </a>
                <a
                    href="{{ url_for('admin.treks') }}"
                    class="btn btn-secondary">

                    Back to Treks

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
