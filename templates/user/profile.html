{% extends "user/base.html" %}

{% block title %}
My Profile
{% endblock %}

{% block user_content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>My Profile</h2>

    <span class="text-muted">
        Welcome, {{ current_user.full_name }}
    </span>

</div>

<div class="card shadow">

    <div class="card-header bg-primary text-white">

        <h4>Edit Profile</h4>

    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">

                    Full Name

                </label>

                <input
                    type="text"
                    name="full_name"
                    class="form-control"
                    value="{{ current_user.full_name }}"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Email

                </label>

                <input
                    type="email"
                    class="form-control"
                    value="{{ current_user.email }}"
                    readonly>

                <div class="form-text">

                    Email cannot be changed.

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Phone Number

                </label>

                <input
                    type="text"
                    name="phone"
                    class="form-control"
                    value="{{ current_user.phone }}"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-success">

                Update Profile

            </button>

        </form>

    </div>

</div>

{% endblock %}
